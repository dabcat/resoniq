<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Resoniq">
  <!-- For dark backgrounds. The wordmark is live text in Instrument Sans SemiBold;
       convert it to outlines before sending to print or to anyone without the font. -->
  <defs>
    <linearGradient id="freq" x1="0" y1="92" x2="0" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset=".55" stop-color="#37C8C0"/>
      <stop offset="1" stop-color="#D8F27A"/>
    </linearGradient>
  </defs>
  <g transform="translate(-14 10)" fill="url(#freq)">
    <rect x="42" y="8.6" width="16" height="9" rx="4.5"/>
    <rect x="37" y="20.9" width="26" height="9" rx="4.5"/>
    <rect x="38" y="33.2" width="24" height="9" rx="4.5"/>
    <rect x="32" y="45.5" width="36" height="9" rx="4.5"/>
    <rect x="26" y="57.8" width="48" height="9" rx="4.5"/>
    <rect x="35" y="70.1" width="46" height="9" rx="4.5"/>
    <rect x="37" y="82.4" width="26" height="9" rx="4.5"/>
  </g>
  <text x="92" y="92" font-family="'Instrument Sans', system-ui, sans-serif" font-size="96" font-weight="600" letter-spacing="-4.3" fill="#F0EBE1">Resoniq</text>
</svg>
